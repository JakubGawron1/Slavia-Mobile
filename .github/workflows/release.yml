# Buduje APK release i dołącza go do GitHub Release przy pushu tagu semver, np. v1.0.1-dev
#
# Podpis APK: sekrety ANDROID_KEYSTORE_* (patrz docs/android-signing.md).
# Bez ANDROID_KEYSTORE_BASE64 CI podpisuje debug keystore runnera — inny podpis niż release .jks.
#
# Uruchomienie z release na GitHubie:
# 1) Plik musi być na domyślnej gałęzi (np. main).
# 2) Utwórz i WYPCHNIJ tag z prefiksem „v”, np.:
#    git tag v1.0.2-dev && git push origin v1.0.2-dev
# 3) W repo: Settings → Actions → General — „Allow GitHub Actions” włączone.
#
# Ręczny test buildu (bez release): Actions → „Release APK” → Run workflow.
name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'
      - 'v*-*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pubspec: path ../Slavia-shared/dart — sibling poza GITHUB_WORKSPACE (git clone, nie actions/checkout path).
      - name: Checkout Slavia-shared (latest main)
        run: |
          DEST="${GITHUB_WORKSPACE}/../Slavia-shared"
          rm -rf "$DEST"
          git clone --depth 1 --branch main https://github.com/JakubGawron1/Slavia-shared.git "$DEST"
          echo "Slavia-shared @ $(git -C "$DEST" rev-parse HEAD)"
          test -f "$DEST/dart/pubspec.yaml"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 nie ustawiony — pomijam (APK: debug keystore CI)."
            exit 0
          fi
          KEYSTORE="${RUNNER_TEMP}/slavia-release.jks"
          # Sekret wklejony z Windows / schowka często ma \r, spacje lub łamania linii — to psuje GNU base64.
          B64_CLEAN=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          B64_LEN=${#B64_CLEAN}
          echo "Base64 po oczyszczeniu: ${B64_LEN} znaków"
          if [ "$B64_LEN" -lt 100 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 za krótki (${B64_LEN} znaków). Wygeneruj ponownie: scripts/encode-android-keystore.ps1"
            exit 1
          fi
          if ! printf '%s' "$B64_CLEAN" | openssl base64 -d -A -out "$KEYSTORE" 2>/dev/null; then
            if ! printf '%s' "$B64_CLEAN" | base64 --decode --ignore-garbage > "$KEYSTORE" 2>/dev/null; then
              echo "::error::Niepoprawny Base64 w ANDROID_KEYSTORE_BASE64. Uruchom encode-android-keystore.ps1 i wklej jedną linię bez cudzysłowów."
              exit 1
            fi
          fi
          KS_SIZE=$(wc -c < "$KEYSTORE" | tr -d ' ')
          if [ "$KS_SIZE" -lt 100 ]; then
            echo "::error::Keystore po dekodowaniu za mały (${KS_SIZE} B)."
            exit 1
          fi
          MAGIC=$(head -c 4 "$KEYSTORE" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" != "feeddfeed" ] && [ "${MAGIC:0:2}" != "3082" ] && [ "${MAGIC:0:2}" != "3081" ]; then
            echo "::warning::Nieznany nagłówek pliku (${MAGIC}) — sprawdź czy sekret to Base64 pliku .jks, nie ścieżka ani hasło."
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Decoded keystore: ${KS_SIZE} bytes"

      - name: Verify Android release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Release keystore: OK ($ANDROID_KEYSTORE_PATH)"
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
              echo "::error::Ustaw sekrety ANDROID_KEYSTORE_PASSWORD i ANDROID_KEY_ALIAS."
              exit 1
            fi
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
            echo "Alias $ANDROID_KEY_ALIAS: verified"
          else
            echo "::warning::Brak ANDROID_KEYSTORE_BASE64 — APK będzie podpisany debug keystore CI."
            echo "::warning::Zainstaluj docs/android-signing.md (sekrety + ten sam .jks lokalnie)."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK as artifact (manual / debug)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
