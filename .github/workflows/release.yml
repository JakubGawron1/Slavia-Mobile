# Buduje APK release i dołącza go do GitHub Release przy pushu tagu semver, np. v1.0.1
#
# Podpis APK: ustaw sekrety ANDROID_KEYSTORE_* (patrz docs/android-signing.md).
# Bez nich CI podpisuje debug keystore runnera — inny podpis niż lokalny PC.
#
# Uruchomienie z release na GitHubie:
# 1) Plik musi być na domyślnej gałęzi (np. main).
# 2) Utwórz i WYPCHNIJ tag z prefiksem „v”, np.:
#    git tag v1.0.1 && git push origin v1.0.1
#    (tag bez „v” — np. 1.0.1 — NIE uruchomi tego workflow.)
# 3) W repo: Settings → Actions → General — „Allow GitHub Actions” włączone.
#
# Ręczny test buildu (bez release): Actions → „Release APK” → Run workflow.
name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Decode release keystore (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/slavia-release.jks
          echo "ANDROID_KEYSTORE_PATH=/tmp/slavia-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK as artifact (manual / debug)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
